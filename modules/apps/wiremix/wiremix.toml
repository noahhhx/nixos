# wiremix config, merged over the built-in defaults. The full reference
# (every option, keybinding, theme property and glyph) is upstream:
# https://github.com/tsowell/wiremix/blob/main/wiremix.toml
#
# Keys: Tab/Shift+Tab switch tabs, j/k select, d makes the selected
# device the default, h/l or 0-9 set volume, m mutes, ? shows help.

# Open straight onto the device picker; the waybar icon is for switching.
tab = "output"

# Match swayosd: volume is capped at 100%.
max_volume_percent = 100.0
enforce_max_volume = true

# Only meter what is on screen; the peak monitors are otherwise running
# for every node while the window is open.
lazy_capture = true

theme = "catppuccin"
char_set = "flat"

# The same flat TUI look as kitty, hyprlock and swayosd: Catppuccin Mocha
# accents on kitty's #0f0f0f base (backgrounds and body text are left to
# the terminal), the purple accent from kitty's active tab and the
# swayosd bar, and the rose accent from the kitty cursor.
[themes.catppuccin]
default_device = { fg = "#f5e0dc" }
default_stream = { fg = "#f5e0dc" }
selector = { fg = "#cba6f7" }
tab = { fg = "#7f849c" }
tab_selected = { fg = "#cba6f7", add_modifier = "BOLD" }
tab_marker = { fg = "#cba6f7" }
list_more = { fg = "#585b70" }
node_title = { fg = "#cdd6f4" }
node_target = { fg = "#9399b2" }
volume = { fg = "#cdd6f4" }
volume_empty = { fg = "#45475a" }
volume_filled = { fg = "#cba6f7" }
meter_inactive = { fg = "#313244" }
meter_active = { fg = "#a6e3a1" }
meter_overload = { fg = "#f38ba8" }
meter_center_inactive = { fg = "#313244" }
meter_center_active = { fg = "#a6e3a1" }
config_device = { fg = "#cdd6f4" }
config_profile = { fg = "#9399b2" }
dropdown_icon = { fg = "#cba6f7" }
dropdown_border = { fg = "#585b70" }
dropdown_item = { fg = "#cdd6f4" }
dropdown_selected = { fg = "#0f0f0f", bg = "#cba6f7" }
dropdown_more = { fg = "#585b70" }
help_border = { fg = "#585b70" }
help_item = { fg = "#cdd6f4" }
help_more = { fg = "#585b70" }

# Square borders instead of the default rounded ones, a solid bar for the
# selection, and a Nerd Font glyph marking the default device.
[char_sets.flat]
default_device = "󰓃"
default_stream = "󰓃"
selector_top = "▌"
selector_middle = "▌"
selector_bottom = "▌"
dropdown_border = "Plain"
help_border = "Plain"
