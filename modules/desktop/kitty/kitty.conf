font_family JetBrainsMono Nerd Font
bold_italic_font auto
font_size 9.0

window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

map F11 toggle_fullscreen
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send
# CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# The config-file socket gets the PID appended, so each instance has its own;
# external/single-instance use gets a stable socket via the launcher flags.
allow_remote_control yes
listen_on unix:@kitty

cursor_shape block
enable_audio_bell no

foreground              #e4e4e4
background              #0f0f0f
selection_foreground    #0f0f0f
selection_background    #e4e4e4
cursor                  #e4e4e4
url_color               #9b9b9b

color0                  #1c1c1c
color1                  #454545
color2                  #505050
color3                  #5b5b5b
color4                  #666666
color5                  #717171
color6                  #7c7c7c
color7                  #d9d9d9
color8                  #4f4f4f
color9                  #808080
color10                 #8a8a8a
color11                 #949494
color12                 #9e9e9e
color13                 #a8a8a8
color14                 #b2b2b2
color15                 #f5f5f5

tab_bar_edge                bottom
tab_bar_style               separator
tab_separator               " ┇ "
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

active_tab_foreground       #0f0f0f
active_tab_background       #d9d9d9
inactive_tab_foreground     #8a8a8a
inactive_tab_background     #0f0f0f
tab_bar_background          #0f0f0f
