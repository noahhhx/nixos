font_family JetBrainsMono Nerd Font
bold_italic_font auto
font_size 9.0

window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

map F11 toggle_fullscreen
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Kitty's legacy encoding sends Alt+Shift+Enter the same as Alt+Enter. Send
# CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# Kitty appends the PID to the socket set in this file, so each instance has
# its own socket. The launcher flags give external and single-instance use a
# stable socket.
allow_remote_control yes
listen_on unix:@kitty

cursor_shape block
enable_audio_bell no

foreground              #cdd6f4
background              #0f0f0f
selection_foreground    #0f0f0f
selection_background    #f5e0dc
cursor                  #f5e0dc
cursor_text_color       #0f0f0f
url_color               #f5e0dc
scrollbar_handle_color  #9399b2

color0                  #45475a
color1                  #f38ba8
color2                  #a6e3a1
color3                  #f9e2af
color4                  #89b4fa
color5                  #f5c2e7
color6                  #94e2d5
color7                  #bac2de
color8                  #585b70
color9                  #f38ba8
color10                 #a6e3a1
color11                 #f9e2af
color12                 #89b4fa
color13                 #f5c2e7
color14                 #94e2d5
color15                 #a6adc8

tab_bar_edge                bottom
tab_bar_style               separator
tab_separator               " ┇ "
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

active_tab_foreground       #0f0f0f
active_tab_background       #cba6f7
inactive_tab_foreground     #cdd6f4
inactive_tab_background     #0f0f0f
tab_bar_background          #0f0f0f
