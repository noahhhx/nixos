# Kitty terminal configuration, mirroring the hand-managed
# ~/.config/kitty/kitty.conf on the Omarchy machine — minus the Omarchy
# theme include (no theme-switcher there) and Omarchy's cwd-lookup socket.
# https://sw.kovidgoyal.net/kitty/conf.html

# Font (JetBrainsMono Nerd Font is provided by the "fonts" aspect).
font_family JetBrainsMono Nerd Font
bold_italic_font auto
font_size 9.0

# Window (window_padding_width sets all four sides)
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# Keybindings
map F11 toggle_fullscreen
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send
# CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# Remote control (kitten icat, kitty @ from inside the window): the
# config-file socket gets the PID appended, so each instance has its own.
# External/single-instance use gets a stable socket via the launcher
# flags in the "hyprland" aspect's bindings.
allow_remote_control yes
listen_on unix:@kitty

# Aesthetics
cursor_shape block
enable_audio_bell no

# Minimal tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
